name: cattle_manager
description: "Dairy cattle management app — offline-first farm tool."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  intl: any
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.2
  fl_chart: ^0.71.0
  json_annotation: ^4.9.0
  logger: ^2.5.0
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.5
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4
  rename_app: ^1.6.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
